      '<rect x="1" y="1" width="38" height="38" rx="11" fill="url(#' + id + 'g)"/><rect x="1" y="1" width="38" height="20" rx="11" fill="url(#' + id + 's)"/>' +
      '<rect x="1.5" y="1.5" width="37" height="37" rx="10.5" stroke="#fff" stroke-opacity=".22"/>' +
      '<path d="M26.2 13.6c-1.3-1.7-3.5-2.7-6.1-2.7-3.6 0-6.2 1.9-6.2 4.8 0 2.7 2.1 3.9 5.8 4.7 3.3.7 4.6 1.4 4.6 3 0 1.7-1.7 2.8-4.3 2.8-2.4 0-4.3-1-5.5-2.8" stroke="#fff" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/>' +
      '<circle cx="28.6" cy="28.4" r="1.9" fill="#fff" fill-opacity=".9"/></svg>';
  }
  /** Fill every [data-icon], [data-brand-mark] placeholder and wire [data-theme-toggle]. */

<script data-src="./pranks.js">
/* pranks.js — prank inbox player + prank panel for the cloak-next shell.
 * Ported from prox/public/pranks.js (same /api/pranks* contract); restyled
 * with ui.css components. Loaded by the shell (and inlined into the cloaked
 * about:blank shell). Requires window.CN (cn.js). */
(function () {
  'use strict';
  if (window.CNPranks || !window.CN) return;
  var POLL_MS = 4000;
  var panelAllowed = false, isAdmin = false, targets = [], started = false;

  function ce(tag, attrs, kids) { return CN.h(tag, attrs, kids); }
  function api(path, o) { o = o || {}; o.noAuthRedirect = true; return CN.api(path, o).then(function (r) { return r.data || {}; }); }

  function scream() {
    try {
      var ctx = new (window.AudioContext || window.webkitAudioContext)();
      var dur = 1.4, sr = ctx.sampleRate, buf = ctx.createBuffer(1, dur * sr, sr), d = buf.getChannelData(0);
      for (var i = 0; i < d.length; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / d.length);
      var noise = ctx.createBufferSource(); noise.buffer = buf;
      var gain = ctx.createGain(); gain.gain.setValueAtTime(0.9, ctx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + dur);
      var osc = ctx.createOscillator(); osc.type = 'sawtooth';
      osc.frequency.setValueAtTime(160, ctx.currentTime);
      osc.frequency.exponentialRampToValueAtTime(45, ctx.currentTime + dur);
      var og = ctx.createGain(); og.gain.value = 0.5;
      noise.connect(gain); gain.connect(ctx.destination);
      osc.connect(og); og.connect(ctx.destination);
      noise.start(); osc.start(); osc.stop(ctx.currentTime + dur);
      setTimeout(function () { ctx.close(); }, dur * 1000 + 200);
    } catch (e) {}
  }
  function ack(id) { api('/api/pranks/' + encodeURIComponent(id) + '/ack', { method: 'POST', json: {} }); }
  function imgUrl(u) {
    u = String(u || '/pranks/clown.svg');
    if (/^https?:/i.test(u)) return u;
    return CN.base + '/x/static' + (u.charAt(0) === '/' ? u : '/' + u);
  }

  function playPrank(prank) {
    var duration = Math.min(60, Math.max(2, prank.durationSec || 8)) * 1000;
    var overlay = ce('div', { class: 'prank-overlay prank-' + prank.type });
    var done = false;
    function finish() {
      if (done) return; done = true;
      document.body.classList.remove('prank-shaking');
      overlay.classList.add('prank-ending');
      setTimeout(function () { overlay.remove(); }, 450);
      document.removeEventListener('keydown', onEsc);
      ack(prank.id);
    }
    function onEsc(e) { if (e.key === 'Escape') finish(); }
    if (prank.type === 'bsod') {
      var pct = ce('div', { class: 'bsod-pct', text: '0% complete' });
      overlay.appendChild(ce('div', { class: 'bsod-emoticon', text: ':(' }));
      overlay.appendChild(ce('div', { class: 'bsod-text', text: "Your PC ran into a problem and needs to restart. We're just collecting some error info, and then we'll restart for you." }));
      overlay.appendChild(pct);
      overlay.appendChild(ce('div', { class: 'bsod-text', text: prank.message || '' }));
      var n = 0, iv = setInterval(function () {
        n = Math.min(100, n + Math.floor(Math.random() * 7)); pct.textContent = n + '% complete';
        if (n >= 100 || done) clearInterval(iv);
      }, 350);
    } else if (prank.type === 'fakeban') {
      overlay.appendChild(ce('div', { class: 'prank-card-box' }, [
        ce('h2', { text: 'Account Suspended' }),
        ce('p', { text: prank.message || 'This account has been suspended for violating the acceptable use policy.' }),
        ce('p', { text: 'Contact your administrator to restore access.' })]));
    } else if (prank.type === 'virus') {
      overlay.appendChild(ce('div', { class: 'prank-card-box' }, [
        ce('h2', { text: 'Windows Defender Security Warning' }),
        ce('p', { text: prank.message || 'Threat detected: Trojan:JS/Prank.Clown - access to this PC has been blocked for your protection.' }),
        ce('p', { text: 'Error code: 0xCLOWN. Do not turn off your computer.' })]));
    } else if (prank.type === 'update') {
      overlay.appendChild(ce('div', { class: 'spin' }));
      overlay.appendChild(ce('div', { class: 'up-text', text: prank.message || "Working on updates - 7% complete.\nDon't turn off your PC." }));
      overlay.appendChild(ce('div', { class: 'up-sub', text: 'This will take a while' }));
    } else if (prank.type === 'shake') {
      document.body.classList.add('prank-shaking');
      overlay.appendChild(ce('div', { class: 'prank-message', text: prank.message || '' }));
      setTimeout(finish, Math.min(duration, 3000));
    } else {
      overlay.appendChild(ce('img', { class: 'prank-scare-img', src: imgUrl(prank.imageUrl), alt: '' }));
      overlay.appendChild(ce('div', { class: 'prank-message', text: prank.message || 'BOO!' }));
      if (prank.sound !== false) scream();
      document.body.classList.add('prank-shaking');
      setTimeout(function () { document.body.classList.remove('prank-shaking'); }, 1500);
    }
    overlay.appendChild(ce('div', { class: 'prank-hint', text: 'press ESC to dismiss' }));
    overlay.addEventListener('click', finish);
    document.addEventListener('keydown', onEsc);
    document.body.appendChild(overlay);
    setTimeout(finish, duration);
  }

  var lastActivity = Date.now();
  ['mousemove', 'mousedown', 'keydown', 'scroll', 'touchstart'].forEach(function (ev) {
    document.addEventListener(ev, function () { lastActivity = Date.now(); }, { passive: true });
  });
  document.addEventListener('visibilitychange', function () { if (!document.hidden) lastActivity = Date.now(); });
  var paused = false;
  function poll() {
    if (document.hidden || paused) return;
    var active = Date.now() - lastActivity < 60000;
    api('/api/pranks/inbox' + (active ? '?active=1' : '')).then(function (data) {
      (data.pranks || []).forEach(function (p, i) { setTimeout(function () { playPrank(p); }, i * 1200); });
    });
  }

  /* ---------- panel ---------- */
  function openPanel() {
    CN.modal(function (box, close) {
      box.classList.add('pp-modal');
      box.appendChild(ce('h3', { text: 'Prank panel' }));
      box.appendChild(ce('p', { class: 'lead', text: 'Pick a target and a prank. Offline targets get it 10 seconds after their next login.' }));
      var status = ce('div', { class: 'hint muted', style: 'min-height:20px;margin-top:8px' });
      var target = ce('select', { class: 'select' });
      var type = ce('select', { class: 'select' }, [
        ['jumpscare', 'Jumpscare (clown)'], ['bsod', 'Fake blue screen'], ['fakeban', 'Fake account ban'],
        ['virus', 'Fake virus alert'], ['update', 'Fake Windows update'], ['shake', 'Screen shake + message']
      ].map(function (o) { return ce('option', { value: o[0], text: o[1] }); }));
      var dur = ce('input', { class: 'input', type: 'number', min: '2', max: '60', value: '8' });
      var msg = ce('textarea', { class: 'textarea', maxlength: '280', placeholder: 'BOO! Got you.', style: 'min-height:70px' });
      var img = ce('input', { class: 'input', type: 'text', value: '/pranks/clown.svg' });
      var delay = ce('input', { class: 'input', type: 'number', min: '0', max: '300', placeholder: '3' });
      var sound = ce('input', { type: 'checkbox' }); sound.checked = true;
      function fld(label, el) { return ce('div', { class: 'field' }, [ce('label', { text: label }), el]); }
      box.appendChild(ce('div', { class: 'stack' }, [
        fld('Target user', target),
        ce('div', { class: 'pp-grid' }, [fld('Prank type', type), fld('Duration (sec)', dur)]),
        fld('Message text', msg),
        ce('div', { class: 'pp-grid' }, [fld('Image (jumpscare)', img), fld('Delay override (sec, online users)', delay)]),
        ce('label', { class: 'row', style: 'gap:10px;cursor:pointer' }, [ce('span', { class: 'switch' }, [sound, ce('span')]), ce('span', { class: 'muted', text: 'Scream sound' })])
      ]));
      var send = ce('button', { class: 'btn primary', type: 'button', text: 'Send prank' });
      box.appendChild(ce('div', { class: 'foot' }, [ce('button', { class: 'btn', type: 'button', text: 'Close', onclick: close }), send]));
      box.appendChild(status);
      box.appendChild(ce('div', { class: 'pp-title', text: 'Recent & pending' }));
      var hist = ce('div', { class: 'pp-list' }); box.appendChild(hist);
      var inv = ce('div'); box.appendChild(inv);

      function loadTargets() {
        api('/api/pranks/targets').then(function (d) {
          targets = d.users || []; target.innerHTML = '';
          targets.forEach(function (u) { target.appendChild(ce('option', { value: u.id, text: u.username + (u.online ? ' (online)' : ' (offline)') + (u.role === 'admin' ? ' - admin' : '') })); });
          renderInvites();
        });
      }
      function loadHist() {
        api('/api/pranks').then(function (d) {
          hist.innerHTML = '';
          (d.pranks || []).slice(0, 15).forEach(function (p) {
            var row = ce('div', { class: 'pp-row' }, [ce('b', { text: p.targetUsername }), ce('span', { class: 'muted', text: p.type }),
              ce('span', { class: 'badge st ' + (p.status === 'pending' ? 'warn' : p.status === 'played' || p.status === 'done' ? 'ok' : ''), text: p.status })]);
            if (p.status === 'pending') row.appendChild(ce('button', { class: 'btn sm danger', type: 'button', text: 'Cancel', onclick: function () { api('/api/pranks/' + encodeURIComponent(p.id), { method: 'DELETE' }).then(loadHist); } }));
            hist.appendChild(row);
          });
          if (!(d.pranks || []).length) hist.appendChild(ce('div', { class: 'muted', text: 'No pranks yet.' }));
        });
      }
      function renderInvites() {
        inv.innerHTML = '';
        if (!isAdmin) return;
        inv.appendChild(ce('div', { class: 'pp-title', text: 'Invite access (admins always allowed)' }));
        api('/api/admin/pranks/access').then(function (d) {
          var list = d.access || [];
          targets.forEach(function (u) {
            if (u.role === 'admin') return;
            var cb = ce('input', { type: 'checkbox' }); cb.checked = list.indexOf(u.id) !== -1;
            cb.addEventListener('change', function () { api('/api/admin/pranks/access', { method: 'POST', json: { userId: u.id, allow: cb.checked } }); });
            inv.appendChild(ce('label', { class: 'pp-row', style: 'cursor:pointer' }, [ce('span', { class: 'switch' }, [cb, ce('span')]), ce('span', { text: u.username })]));
          });
        });
      }
      send.addEventListener('click', function () {
        if (!target.value) { status.textContent = 'Pick a target user first.'; return; }
        send.disabled = true;
        api('/api/pranks', { method: 'POST', json: { targetId: target.value, type: type.value, message: msg.value, imageUrl: img.value, sound: sound.checked, durationSec: Number(dur.value) || 8, delaySec: delay.value === '' ? null : Number(delay.value) } }).then(function (d) {
          send.disabled = false;
          if (d.ok) { status.textContent = d.queuedForLogin ? 'Queued - target is offline; fires 10s after their next login.' : 'Sent! Fires in about ' + (d.deliverInSec != null ? d.deliverInSec : 3) + 's.'; loadHist(); }
          else status.textContent = d.error || 'Failed to send.';
        });
      });
      loadTargets(); loadHist();
    });
  }

  /** init({user, onAllowed}) — starts the inbox poll and reports panel access. */
  function init(opts) {
    opts = opts || {};
    isAdmin = !!(opts.user && opts.user.role === 'admin');
    CN.api('/api/pranks/access', { noAuthRedirect: true }).then(function (r) {
      // 404 = a server without the pranks routes: stay quiet instead of polling forever.
      if (r.status === 404) { paused = true; return; }
      panelAllowed = !!(r.data && r.data.allowed);
      if (opts.onAllowed) opts.onAllowed(panelAllowed);
    });
    if (!started) { started = true; setInterval(poll, POLL_MS); setTimeout(poll, 1500); }
  }
  window.CNPranks = { pause: function (v) { paused = !!v; }, init: init, openPanel: openPanel, play: playPrank };
})();

</script>
<script type="application/json" id="cn-pages">{"assets":{"login.css":"/* login.css — page-specific polish on top of ui.css */\n.auth-card .brand { animation: brandIn .8s var(--ease) both; }\n@keyframes brandIn { from { opacity: 0; transform: translateY(-8px) scale(.9); } }\n.auth-card h1 { background: linear-gradient(120deg, var(--text) 30%, var(--accent) 100%); -webkit-background-clip: text; background-clip: text; color: transparent; }\n.auth-card #banner, .auth-card #error { margin-bottom: 14px; }\n.auth-card .field { animation: fieldIn .6s var(--ease) both; }\n.auth-card .field:nth-child(1) { animation-delay: .12s; }\n.auth-card .field:nth-child(2) { animation-delay: .2s; }\n@keyframes fieldIn { from { opacity: 0; transform: translateY(10px); } }\n#submit { margin-top: 4px; }\n.access { display: flex; gap: 13px; align-items: center; margin-top: 22px; padding: 14px 15px; border-radius: 15px; background: var(--sunken); border: 1px dashed var(--border-strong); font-size: .86rem; color: var(--muted); line-height: 1.45; }\n.access .ico { width: 38px; height: 38px; border-radius: 11px; display: grid; place-items: center; flex: none; color: var(--accent); background: var(--accent-soft); }\n.access b { color: var(--text); font-weight: 650; }\n.access a { font-weight: 650; }\n.signed { display: flex; align-items: center; gap: 12px; padding: 12px 14px; margin-bottom: 16px; border-radius: 14px; background: var(--ok-soft); color: var(--ok); font-size: .88rem; }\n.signed a { margin-left: auto; font-weight: 700; }\n.two { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }\n@media (max-width: 520px) { .two { grid-template-columns: 1fr; } .auth-card { padding: 28px 20px 22px; } }\n.success { text-align: center; display: flex; flex-direction: column; align-items: center; gap: 4px; padding-top: 6px; outline: none; }\n.success .tick { width: 72px; height: 72px; border-radius: 50%; display: grid; place-items: center; margin-top: 18px; color: #fff; background: var(--grad); box-shadow: 0 14px 34px rgba(120, 80, 245, .45); animation: tick .7s var(--ease) both; }\n.success .lead { max-width: 380px; margin: 4px 0 18px; }\n@keyframes tick { from { transform: scale(.4) rotate(-20deg); opacity: 0; } }\n","login.js":"/* login.js — MN Unblocker credential login (POST /api/auth/login), same\n * contract and token mechanics as prox: the response `token` is stored in\n * localStorage ('mnu_token') and handed on via ?mnuToken= / postMessage. */\n(function () {\n  'use strict';\n  var $ = CN.$;\n  CN.hydrate();\n  var params = { get: CN.query };\n  var embedded = CN.embedded();\n  var form = $('#form'), userEl = $('#username'), passEl = $('#password'), btn = $('#submit');\n  var card = $('#card');\n\n  if (!embedded) userEl.focus();\n\n  // ?reason= banner\n  var reason = params.get('reason');\n  var msg = reason === 'elsewhere' ? 'You were signed out because your account signed in somewhere else.'\n    : reason === 'required' ? 'Please sign in to continue.'\n    : reason === 'expired' ? 'Your session expired. Please sign in again.' : null;\n  if (msg) { $('#bannerText').textContent = msg; $('#banner').classList.remove('hidden'); }\n  $('#bannerX').addEventListener('click', function () { $('#banner').classList.add('hidden'); });\n  \n\n  $('#toggle').innerHTML = CN.icon('eye', 17);\n  $('#toggle').addEventListener('click', function () {\n    var hide = passEl.type === 'password';\n    passEl.type = hide ? 'text' : 'password';\n    $('#toggle').innerHTML = CN.icon(hide ? 'eyeoff' : 'eye', 17);\n    $('#toggle').setAttribute('aria-pressed', String(hide));\n    $('#toggle').setAttribute('aria-label', hide ? 'Hide password' : 'Show password');\n    passEl.focus();\n  });\n\n  function clearError() {\n    $('#error').classList.add('hidden');\n    $('#fUser').classList.remove('invalid'); $('#fPass').classList.remove('invalid');\n  }\n  function showError(m) {\n    $('#errorText').textContent = m;\n    $('#error').classList.remove('hidden');\n    $('#fUser').classList.add('invalid'); $('#fPass').classList.add('invalid');\n    card.classList.remove('shake'); void card.offsetWidth; card.classList.add('shake');\n  }\n  function loading(on) { btn.disabled = on; btn.classList.toggle('loading', on); }\n  [userEl, passEl].forEach(function (el) { el.addEventListener('input', clearError); });\n\n  // Where to go after login: only same-origin static pages, never an arbitrary URL.\n  function nextPage() {\n    var n = params.get('next') || '';\n    return /^[A-Za-z0-9_.-]+\\.html(\\?[\\w=&%.-]*)?$/.test(n) ? n : 'launch.html';\n  }\n  function done(token, user) {\n    if (embedded) {\n      // Post only to the actual parent origin when the browser tells us (Chrome ancestorOrigins);\n      // an opaque ('null') parent can only be addressed with '*'.\n      var to = '*';\n      try { var ao = location.ancestorOrigins && location.ancestorOrigins[0]; if (ao && ao !== 'null') to = ao; } catch (e) {}\n      try { window.parent.postMessage({ cloakAuth: 'login', token: token || null, user: user || null }, to); } catch (e) {}\n      $('#form').classList.add('hidden');\n      var ok = CN.h('div', { class: 'signed', html: CN.icon('check') + '\u003cspan>Signed in as \u003cb>' + CN.esc(user && user.username || 'you') + '\u003c/b>.\u003c/span>' });\n      card.insertBefore(ok, $('#form'));\n      return;\n    }\n    var target = CN.page(nextPage());\n    target += (target.indexOf('?') >= 0 ? '&' : '?') + (token ? 'mnuToken=' + encodeURIComponent(token) : 'ok=1');\n    location.href = target;\n  }\n\n  form.addEventListener('submit', function (e) {\n    e.preventDefault();\n    clearError();\n    var username = userEl.value.trim(), password = passEl.value;\n    if (!username || !password) { showError('Please enter both a username and password.'); return; }\n    loading(true);\n    CN.api('/api/auth/login', { method: 'POST', json: { username: username, password: password }, noAuthRedirect: true }).then(function (r) {\n      var d = r.data || {};\n      if (r.status === 200 && d.ok) {\n        if (d.token) CN.Token.set(d.token);\n        done(d.token, d.user);\n        return;\n      }\n      loading(false);\n      if (r.network) return showError(\"Couldn't reach the server — try again.\");\n      if (r.status === 401) showError(d.error || 'Invalid username or password');\n      else if (r.status === 429) showError(d.error || 'Too many attempts, try again in a minute.');\n      else if (r.status === 403) showError(d.error || 'This account has been suspended');\n      else showError(d.error || 'Something went wrong — please try again.');\n    });\n  });\n\n  // Already signed in? Offer a one-click continue (skipped in embed mode and after a forced sign-out).\n  if (!embedded && !reason) {\n    CN.who().then(function (w) {\n      if (!w.authenticated || w.open) return;\n      var a = CN.h('a', { href: CN.page(nextPage(), null, true), text: 'Continue →' });\n      var s = CN.h('div', { class: 'signed', html: CN.icon('check') + '\u003cspan>Signed in as \u003cb>' + CN.esc(w.user.username) + '\u003c/b>\u003c/span>' }, [a]);\n      card.insertBefore(s, $('#form'));\n    });\n  }\n})();\n","history.css":"/* history.html — works as a full page and inside the shell's slide-over sheet (?embed=1) */\n.hwrap { width: min(760px, 100%); margin: 0 auto; padding: 18px 18px 60px; }\n.hhead { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; }\n.hgrow { flex: 1; }\n.htitle { font-size: 1.8rem; font-weight: 780; margin: 14px 0 16px; }\n.embed .only-page { display: none !important; }\n.embed .hwrap { padding-top: 12px; }\n.hsearch { margin: 4px 0 10px; position: sticky; top: 0; z-index: 4; padding: 4px 0; }\n.hsearch .input { height: 46px; border-radius: 14px; background: var(--surface-2); box-shadow: var(--shadow-sm); }\n.hsum { font-size: .8rem; margin: 6px 4px 12px; }\n.hday { margin: 20px 0 8px 4px; font-size: .72rem; font-weight: 700; letter-spacing: .09em; text-transform: uppercase; color: var(--faint); }\n.hgroup { border-radius: 16px; overflow: hidden; background: var(--surface); border: 1px solid var(--border); -webkit-backdrop-filter: blur(16px); backdrop-filter: blur(16px); }\n.hitem { position: relative; display: flex; align-items: center; gap: 12px; padding: 10px 12px 10px 14px; cursor: pointer; border-bottom: 1px solid var(--border); transition: background .15s, transform .3s var(--ease), opacity .3s; animation: rise .35s var(--ease) both; }\n.hitem:last-child { border-bottom: 0; }\n.hitem:hover { background: var(--accent-soft); }\n.hitem.gone { opacity: 0; transform: translateX(30px); }\n.hfav { width: 34px; height: 34px; border-radius: 11px; display: grid; place-items: center; flex: none; font: 800 .9rem var(--font); color: #fff; box-shadow: inset 0 1px 0 rgba(255, 255, 255, .3); }\n.hmain { flex: 1; min-width: 0; line-height: 1.3; }\n.hmain .t { font-weight: 600; font-size: .9rem; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }\n.hmain .u { font-size: .76rem; color: var(--faint); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }\n.hmain .u mark { background: var(--accent-soft); color: var(--accent); border-radius: 3px; }\n.htime { font-size: .74rem; color: var(--faint); flex: none; font-variant-numeric: tabular-nums; }\n.hdel { opacity: 0; flex: none; }\n.hitem:hover .hdel, .hitem:focus-within .hdel { opacity: 1; }\n@media (hover: none) { .hdel { opacity: 1; } }\n.hitem .badge { flex: none; }\n.hmore { display: grid; place-items: center; margin-top: 18px; }\n","history.js":"/* history.js — GET /api/history (paged, search), DELETE /api/history[/:id].\n * Opening an entry: inside the shell sheet -> postMessage to the shell\n * (which navigates the active tab); standalone -> launch.html?go=\u003curl>. */\n(function () {\n  'use strict';\n  var $ = CN.$;\n  var embedded = CN.embedded();\n  if (embedded) document.body.classList.add('embed');\n  CN.hydrate();\n  var state = { q: '', page: 1, pages: 1, total: 0, items: [], loading: false };\n  var LIMIT = 40;\n\n  function hue(s) { var h = 0; for (var i = 0; i \u003c s.length; i++) h = (h * 31 + s.charCodeAt(i)) % 360; return h; }\n  function dayLabel(ts) {\n    var d = new Date(ts), t = new Date(); t.setHours(0, 0, 0, 0);\n    var day = new Date(d); day.setHours(0, 0, 0, 0);\n    var diff = Math.round((t - day) / 86400000);\n    if (diff === 0) return 'Today';\n    if (diff === 1) return 'Yesterday';\n    return d.toLocaleDateString([], { weekday: 'long', month: 'long', day: 'numeric', year: d.getFullYear() === t.getFullYear() ? undefined : 'numeric' });\n  }\n  function open(url, newTab) {\n    if (embedded) window.parent.postMessage({ cloakShell: 'open', url: url, newTab: !!newTab }, '*');\n    else location.href = CN.page('launch.html', { go: url }, true);\n  }\n  function hl(text, q) {\n    if (!q) return CN.esc(text);\n    var i = text.toLowerCase().indexOf(q.toLowerCase());\n    if (i \u003c 0) return CN.esc(text);\n    return CN.esc(text.slice(0, i)) + '\u003cmark>' + CN.esc(text.slice(i, i + q.length)) + '\u003c/mark>' + CN.esc(text.slice(i + q.length));\n  }\n\n  function render() {\n    var list = $('#list');\n    list.innerHTML = '';\n    if (!state.items.length) {\n      list.innerHTML = '\u003cdiv class=\"empty\">' + CN.icon('history', 46) + '\u003ch4>' + (state.q ? 'No matches' : 'Nothing here yet') + '\u003c/h4>\u003cspan>' +\n        (state.q ? 'Try a different search.' : 'Pages you visit will show up here.') + '\u003c/span>\u003c/div>';\n      $('#summary').textContent = '';\n      $('#more').hidden = true;\n      $('#clearAll').disabled = !state.total && !state.q;\n      return;\n    }\n    var lastDay = null, group = null, n = 0;\n    state.items.forEach(function (it) {\n      var dl = dayLabel(it.ts);\n      if (dl !== lastDay) {\n        lastDay = dl;\n        list.appendChild(CN.h('div', { class: 'hday', text: dl }));\n        group = CN.h('div', { class: 'hgroup' });\n        list.appendChild(group);\n      }\n      var host = (it.hostname || CN.hostOf(it.url)).replace(/^www\\./, '');\n      it = Object.assign({}, it, { title: CN.decode(it.title) });\n      var row = CN.h('div', { class: 'hitem', tabindex: '0', role: 'link', title: it.url });\n      row.style.animationDelay = Math.min(n++ * 12, 240) + 'ms';\n      row.innerHTML =\n        '\u003cspan class=\"hfav\" style=\"background:hsl(' + hue(host) + ' 62% 48%)\">' + CN.esc((host.charAt(0) || '?').toUpperCase()) + '\u003c/span>' +\n        '\u003cdiv class=\"hmain\">\u003cdiv class=\"t\">' + hl(it.title || host, state.q) + '\u003c/div>\u003cdiv class=\"u\">' + hl(it.url, state.q) + '\u003c/div>\u003c/div>' +\n        (it.type === 'search' ? '\u003cspan class=\"badge accent\">search\u003c/span>' : '') +\n        '\u003cspan class=\"htime\">' + new Date(it.ts).toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' }) + '\u003c/span>';\n      var del = CN.h('button', { class: 'btn icon sm ghost hdel', type: 'button', title: 'Remove from history', 'aria-label': 'Remove', html: CN.icon('x', 16) });\n      del.addEventListener('click', function (e) {\n        e.stopPropagation();\n        CN.api('/api/history/' + encodeURIComponent(it.id), { method: 'DELETE' }).then(function (r) {\n          if (r.ok || r.status === 404) {\n            row.classList.add('gone');\n            setTimeout(function () {\n              state.items = state.items.filter(function (x) { return x.id !== it.id; });\n              state.total = Math.max(0, state.total - 1);\n              render();\n            }, 280);\n          } else CN.toast((r.data && r.data.error) || 'Could not delete that entry.', 'bad');\n        });\n      });\n      row.appendChild(del);\n      row.addEventListener('click', function (e) { open(it.url, e.ctrlKey || e.metaKey || e.shiftKey); });\n      row.addEventListener('keydown', function (e) { if (e.key === 'Enter') open(it.url); });\n      group.appendChild(row);\n    });\n    $('#summary').textContent = state.total + ' visit' + (state.total === 1 ? '' : 's') + (state.q ? ' matching “' + state.q + '”' : '');\n    $('#more').hidden = state.page >= state.pages;\n    $('#clearAll').disabled = false;\n  }\n\n  function load(reset) {\n    if (state.loading) return;\n    state.loading = true;\n    if (reset) { state.page = 1; state.items = []; $('#list').innerHTML = '\u003cdiv class=\"stack\">' + [1, 2, 3, 4, 5].map(function () { return '\u003cdiv class=\"skel\" style=\"height:54px;border-radius:14px\">\u003c/div>'; }).join('') + '\u003c/div>'; }\n    else state.page += 1;\n    CN.api('/api/history', { query: { q: state.q, page: state.page, limit: LIMIT } }).then(function (r) {\n      state.loading = false;\n      if (!r.ok) {\n        $('#list').innerHTML = '\u003cdiv class=\"empty\">' + CN.icon('warn', 46) + '\u003ch4>Couldn’t load history\u003c/h4>\u003cspan>' + CN.esc((r.data && r.data.error) || 'Please try again.') + '\u003c/span>\u003c/div>';\n        return;\n      }\n      var d = r.data || {};\n      state.items = state.items.concat(d.items || []);\n      state.total = d.total || 0;\n      state.pages = d.pages || 1;\n      render();\n    });\n  }\n\n  var t;\n  $('#q').addEventListener('input', function () {\n    clearTimeout(t);\n    var v = this.value.trim();\n    t = setTimeout(function () { state.q = v; load(true); }, 220);\n  });\n  $('#moreBtn').addEventListener('click', function () { load(false); });\n  $('#clearAll').addEventListener('click', function () {\n    CN.confirm('Clear all history?', 'This removes every entry from your history list. It cannot be undone.', 'Clear history', true).then(function (ok) {\n      if (!ok) return;\n      CN.api('/api/history', { method: 'DELETE' }).then(function (r) {\n        if (r.ok) { CN.toast('History cleared', 'ok'); state.q = ''; $('#q').value = ''; load(true); }\n        else CN.toast((r.data && r.data.error) || 'Could not clear history.', 'bad');\n      });\n    });\n  });\n  document.addEventListener('keydown', function (e) {\n    if (e.key === 'Escape' && embedded && !document.querySelector('.modal-backdrop')) window.parent.postMessage({ cloakShell: 'close' }, '*');\n    if ((e.ctrlKey || e.metaKey) && e.key === 'h' && embedded) { e.preventDefault(); window.parent.postMessage({ cloakShell: 'close' }, '*'); }\n    if (e.key === '/' && document.activeElement !== $('#q')) { e.preventDefault(); $('#q').focus(); }\n  });\n\n  CN.requireAuth().then(function () { load(true); $('#q').focus(); }).catch(function (e) {\n    $('#list').innerHTML = '\u003cdiv class=\"empty\">' + CN.icon('warn', 46) + '\u003ch4>' + (e.message === 'offline' ? 'You’re offline' : 'Something went wrong') + '\u003c/h4>\u003c/div>';\n  });\n})();\n","stats.css":".swrap { width: min(1120px, 100%); margin: 0 auto; padding: 18px clamp(14px, 3vw, 32px) 64px; }\n.shead { display: flex; align-items: center; gap: 8px; margin-bottom: 22px; }\n.embed .only-page { display: none !important; }\n.embed .swrap { padding-top: 22px; }\n.tile-icon { position: absolute; right: 14px; top: 14px; width: 34px; height: 34px; border-radius: 11px; display: grid; place-items: center; color: var(--accent); background: var(--accent-soft); z-index: 1; }\n.stat { z-index: 0; }\n.unlimited { display: inline-flex; align-items: center; gap: 8px; }\n.unlimited .inf { font-size: 2.1rem; line-height: 1; background: var(--grad); -webkit-background-clip: text; background-clip: text; color: transparent; }\n.tbl .who { display: flex; align-items: center; gap: 10px; font-weight: 600; }\n.tbl .who .avatar { width: 28px; height: 28px; font-size: .7rem; }\n","charts.js":"/* charts.js — tiny hand-written SVG/HTML charts for stats + admin (no libs).\n * Colors come from ui.css tokens, so dark/light \"just work\". */\n(function (root) {\n  'use strict';\n  var NS = 'http://www.w3.org/2000/svg';\n  var uid = 0;\n  function svgEl(tag, attrs) {\n    var el = document.createElementNS(NS, tag);\n    for (var k in (attrs || {})) el.setAttribute(k, attrs[k]);\n    return el;\n  }\n  var tip;\n  function tipShow(text, x, y) {\n    if (!tip) { tip = document.createElement('div'); tip.className = 'chart-tip'; document.body.appendChild(tip); }\n    tip.textContent = text;\n    tip.classList.add('on');\n    var w = tip.offsetWidth;\n    tip.style.left = Math.min(window.innerWidth - w - 8, Math.max(8, x - w / 2)) + 'px';\n    tip.style.top = (y - 38) + 'px';\n  }\n  function tipHide() { if (tip) tip.classList.remove('on'); }\n  function nice(max) {\n    if (max \u003c= 4) return 4;\n    var p = Math.pow(10, Math.floor(Math.log10(max)));\n    var n = max / p;\n    return (n \u003c= 1 ? 1 : n \u003c= 2 ? 2 : n \u003c= 5 ? 5 : 10) * p;\n  }\n  function empty(el, msg) {\n    el.innerHTML = '\u003cdiv class=\"empty\" style=\"padding:26px 10px\">\u003cspan>' + (msg || 'No data yet') + '\u003c/span>\u003c/div>';\n  }\n\n  /** area({data:[{label,value,title?}], height, fmt}) — smooth line + gradient fill + hover dots. */\n  function area(el, data, opts) {\n    opts = opts || {};\n    el.innerHTML = '';\n    if (!data || !data.length || !data.some(function (d) { return d.value > 0; })) return empty(el, opts.empty);\n    var W = Math.max(320, el.clientWidth || 720), H = opts.height || 220, pl = 34, pr = 10, pt = 12, pb = 26;\n    if (data.length === 1) data = [data[0], data[0]];\n    var max = nice(Math.max.apply(null, data.map(function (d) { return d.value; })));\n    var id = 'ag' + (++uid);\n    var svg = svgEl('svg', { viewBox: '0 0 ' + W + ' ' + H, class: 'chart', role: 'img' });\n    var defs = svgEl('defs');\n    var g = svgEl('linearGradient', { id: id, x1: 0, y1: 0, x2: 0, y2: 1 });\n    g.appendChild(svgEl('stop', { offset: '0', 'stop-color': 'var(--chart-1)', 'stop-opacity': '.42' }));\n    g.appendChild(svgEl('stop', { offset: '1', 'stop-color': 'var(--chart-1)', 'stop-opacity': '0' }));\n    defs.appendChild(g); svg.appendChild(defs);\n    var grid = svgEl('g', { class: 'grid' });\n    for (var i = 0; i \u003c= 4; i++) {\n      var y = pt + (H - pt - pb) * i / 4;\n      grid.appendChild(svgEl('line', { x1: pl, x2: W - pr, y1: y, y2: y }));\n      var t = svgEl('text', { x: pl - 6, y: y + 3.5, 'text-anchor': 'end' });\n      t.textContent = root.CN ? CN.num(Math.round(max * (4 - i) / 4)) : Math.round(max * (4 - i) / 4);\n      svg.appendChild(t);\n    }\n    svg.appendChild(grid);\n    var n = data.length, step = (W - pl - pr) / Math.max(1, n - 1);\n    var pts = data.map(function (d, i) { return [pl + i * step, pt + (H - pt - pb) * (1 - d.value / max)]; });\n    var path = 'M' + pts.map(function (p) { return p[0].toFixed(1) + ' ' + p[1].toFixed(1); }).join(' L');\n    // smooth via simple catmull-ish quadratic midpoints\n    var d = 'M' + pts[0][0] + ' ' + pts[0][1];\n    for (var k = 1; k \u003c pts.length; k++) {\n      var mx = (pts[k - 1][0] + pts[k][0]) / 2;\n      d += ' C' + mx + ' ' + pts[k - 1][1] + ' ' + mx + ' ' + pts[k][1] + ' ' + pts[k][0] + ' ' + pts[k][1];\n    }\n    var fill = svgEl('path', { d: d + ' L' + pts[n - 1][0] + ' ' + (H - pb) + ' L' + pts[0][0] + ' ' + (H - pb) + ' Z', fill: 'url(#' + id + ')' });\n    svg.appendChild(fill);\n    var line = svgEl('path', { d: d, class: 'line' });\n    svg.appendChild(line);\n    var every = Math.max(1, Math.ceil(n / (opts.ticks || 8)));\n    data.forEach(function (dd, i) {\n      if (i % every === 0 || i === n - 1) {\n        var lt = svgEl('text', { x: pts[i][0], y: H - 8, 'text-anchor': i === 0 ? 'start' : i === n - 1 ? 'end' : 'middle' });\n        lt.textContent = dd.label; svg.appendChild(lt);\n      }\n    });\n    var dot = svgEl('circle', { r: 5, class: 'pt', opacity: 0 });\n    svg.appendChild(dot);\n    var hit = svgEl('rect', { x: pl, y: 0, width: W - pl - pr, height: H, fill: 'transparent' });\n    svg.appendChild(hit);\n    hit.addEventListener('mousemove', function (e) {\n      var r = svg.getBoundingClientRect();\n      var rel = (e.clientX - r.left) / r.width * W;\n      var i = Math.max(0, Math.min(n - 1, Math.round((rel ems: center; gap: 12px; padding: 8px 10px; border-radius: 12px; background: var(--sunken); }\n.side .nav-item .pill[hidden] { display: none; }\n.formgrid { display: grid; gap: 14px; }\n.pw-row { display: flex; gap: 8px; }\n.pw-row .input { flex: 1; }\n.tbl td.wrap { white-space: normal; max-width: 420px; word-break: break-word; }\n.err-row td { font-size: .8rem; }\n.mono-sm { font: .78rem var(--mono); color: var(--muted); }\n.sortable-hint { display: none; }\n","admin.js":"/* admin.js — admin panel. Same /api/admin/* contracts as prox (see\n * cloak-next/docs/auth-admin.md); memory/WASM limits do not exist any more. */\n(function () {\n  'use strict';\n  var $ = CN.$, $$ = CN.$$, h = CN.h, esc = CN.esc;\n  var embedded = CN.embedded();\n  if (embedded) document.body.classList.add('embed');\n  CN.hydrate();\n\n  var me = null;\n  var S = { users: [], loaded: {}, appFilter: 'pending', act: { page: 1, pages: 1, total: 0 } };\n\n  /* ---------- helpers ---------- */\n  function bytes(n) {\n    n = Number(n) || 0; var u = ['B', 'KB', 'MB', 'GB', 'TB'], i = 0;\n    while (n >= 1024 && i \u003c u.length - 1) { n /= 1024; i++; }\n    return (i ? n.toFixed(n >= 100 ? 0 : 1) : n) + ' ' + u[i];\n  }\n  function ok(r, okMsg) {\n    if (r.ok) { if (okMsg) CN.toast(okMsg, 'ok'); return true; }\n    CN.toast((r.data && r.data.error) || (r.network ? \"Couldn't reach the server.\" : 'Something went wrong.'), 'bad');\n    return false;\n  }\n  function tile(icon, label, value, note) {\n    return '\u003cdiv class=\"stat\">\u003cspan class=\"tile-icon\">' + CN.icon(icon, 18) + '\u003c/span>\u003cdiv class=\"k\">' + esc(label) + '\u003c/div>\u003cdiv class=\"v\">' + value + '\u003c/div>' + (note ? '\u003cdiv class=\"d\">' + note + '\u003c/div>' : '') + '\u003c/div>';\n  }\n  function avatar(name) { return '\u003cspan class=\"avatar\">' + esc((name || '?').charAt(0)) + '\u003c/span>'; }\n  function field(label, el, hint) { return h('div', { class: 'field' }, [h('label', { text: label }), el, hint ? h('span', { class: 'hint', text: hint }) : null]); }\n  function genPassword() {\n    var chars = 'abcdefghijkmnpqrstuvwxyzABCDEFGHJKLMNPQRSTUVWXYZ23456789', out = '';\n    var a = new Uint32Array(12); crypto.getRandomValues(a);\n    for (var i = 0; i \u003c 12; i++) out += chars[a[i] % chars.length];\n    return out;\n  }\n  function empty(icon, title, text) { return '\u003cdiv class=\"empty\">' + CN.icon(icon, 46) + '\u003ch4>' + esc(title) + '\u003c/h4>\u003cspan>' + esc(text || '') + '\u003c/span>\u003c/div>'; }\n\n  /* ---------- sortable / searchable table ---------- */\n  function dataTable(host, o) {\n    var st = { q: '', key: o.sortKey || null, dir: o.sortDir || 1, rows: o.rows || [] };\n    host.innerHTML = '';\n    var tools = h('div', { class: 'tools' });\n    var search = null, count = h('span', { class: 'count' });\n    if (o.search !== false) {\n      search = h('input', { class: 'input sm', placeholder: o.searchPlaceholder || 'Search…', autocomplete: 'off' });\n      tools.appendChild(h('div', { class: 'input-icon' }, [h('span', { html: CN.icon('search', 16) }), search]));\n    }\n    tools.appendChild(count);\n    if (o.tools) tools.appendChild(o.tools);\n    var wrap = h('div', { class: 'table-wrap' });\n    var table = h('table', { class: 'tbl' });\n    var thead = h('thead'), tbody = h('tbody');\n    var tr = h('tr');\n    o.cols.forEach(function (c) {\n      var th = h('th', { class: (c.num ? 'num ' : '') + (c.sort ? 'sortable' : ''), html: esc(c.label) + (c.sort ? '\u003cspan class=\"arr\">▲\u003c/span>' : '') });\n      if (c.sort) th.addEventListener('click', function () {\n        if (st.key === c.key) st.dir = -st.dir; else { st.key = c.key; st.dir = c.num ? -1 : 1; }\n        paint();\n      });\n      c._th = th; tr.appendChild(th);\n    });\n    thead.appendChild(tr); table.appendChild(thead); table.appendChild(tbody); wrap.appendChild(table);\n    if (o.search !== false || o.tools) host.appendChild(tools);\n    host.appendChild(wrap);\n    var emptyEl = h('div'); host.appendChild(emptyEl);\n\n    function paint() {\n      var rows = st.rows.slice();\n      if (st.q) {\n        var q = st.q.toLowerCase();\n        rows = rows.filter(function (r) { return (o.text ? o.text(r) : JSON.stringify(r)).toLowerCase().indexOf(q) >= 0; });\n      }\n      var col = o.cols.filter(function (c) { return c.key === st.key; })[0];\n      if (col && col.sort) rows.sort(function (a, b) {\n        var x = col.sort(a), y = col.sort(b);\n        return (x > y ? 1 : x \u003c y ? -1 : 0) * st.dir;\n      });\n      o.cols.forEach(function (c) {\n        c._th.classList.toggle('sorted', c.key === st.key);\n        var arr = c._th.querySelector('.arr'); if (arr) arr.textContent = st.dir > 0 ? '▲' : '▼';\n      });\n      count.textContent = rows.length + (rows.length === 1 ? ' result' : ' results');\n      tbody.innerHTML = rows.map(function (r, i) {\n        return '\u003ctr data-i=\"' + i + '\">' + o.cols.map(function (c) {\n          return '\u003ctd class=\"' + (c.num ? 'num ' : '') + (c.wrap ? 'wrap' : '') + '\">' + c.render(r) + '\u003c/td>';\n        }).join('') + '\u003c/tr>';\n      }).join('');\n      tbody.__rows = rows;\n      wrap.hidden = !rows.length;\n      emptyEl.innerHTML = rows.length ? '' : (o.empty ? empty(o.empty[0], o.empty[1], st.q ? 'No rows match your search.' : o.empty[2]) : '');\n    }\n    tbody.addEventListener('click', function (e) {\n      var b = e.target.closest('[data-act]');\n      if (!b || !o.onAction) return;\n      var tr = b.closest('tr'); var row = tbody.__rows[+tr.getAttribute('data-i')];\n      o.onAction(b.getAttribute('data-act'), row, b);\n    });\n    if (search) search.addEventListener('input', function () { st.q = search.value.trim(); paint(); });\n    paint();\n    return { update: function (rows) { st.rows = rows; paint(); } };\n  }\n\n  /* ---------- navigation ---------- */\n  var TITLES = { overview: 'Overview', activity: 'Activity log', users: 'Users', applications: 'Applications', rules: 'Rules & blocking', pranks: 'Pranks', system: 'System' };\n  var loaders = {\n    overview: loadOverview, activity: function () { loadUsers().then(fillUserFilter); loadActivity(1); }, users: loadUsers,\n    applications: loadApplications, rules: loadRules, pranks: loadPranks, system: loadSystem\n  };\n  function show(sec) {\n    if (!TITLES[sec]) sec = 'overview';\n    $$('.section').forEach(function (s) { s.hidden = s.id !== 'sec-' + sec; });\n    $$('.nav-item[data-sec]').forEach(function (b) { b.classList.toggle('on', b.getAttribute('data-sec') === sec); });\n    $('#topTitle').textContent = TITLES[sec];\n    closeSide();\n    try { history.replaceState(null, '', '#' + sec); } catch (e) {}\n    loaders[sec]();\n    window.scrollTo(0, 0);\n  }\n  $$('.nav-item[data-sec]').forEach(function (b) { b.addEventListener('click', function () { show(b.getAttribute('data-sec')); }); });\n  function closeSide() { $('#side').classList.remove('open'); $('#scrim').classList.remove('on'); }\n  $('#menuBtn').addEventListener('click', function () { $('#side').classList.add('open'); $('#scrim').classList.add('on'); });\n  $('#scrim').addEventListener('click', closeSide);\n  $('#logout').addEventListener('click', function () { CN.logout().then(function () { CN.navigate('login.html'); }); });\n  document.addEventListener('keydown', function (e) { if (e.key === 'Escape' && embedded && !document.querySelector('.modal-backdrop')) window.parent.postMessage({ cloakShell: 'close' }, '*'); });\n  $('#brandLink').href = CN.page('launch.html', {}, true);\n  $('#openBrowser').href = CN.page('launch.html', {}, true);\n\n  /* ---------- overview ---------- */\n  function loadOverview() {\n    Promise.all([\n      CN.api('/api/admin/activity/stats'), CN.api('/api/admin/stats/overview'),\n      CN.api('/api/admin/sessions'), CN.api('/api/admin/users')\n    ]).then(function (res) {\n      var a = res[0].data || {}, o = res[1].data || {}, ss = res[2].data || {}, us = res[3].data || {};\n      var perUser = a.perUser || [];\n      var blocked = 0, searches = 0;\n      perUser.forEach(function (u) { blocked += u.blocked; searches += u.searches; });\n      var online = (us.users || []).filter(function (u) { return u.online; }).length;\n      $('#ovTiles').innerHTML =\n        tile('activity', 'Events (30d)', CN.num(a.total || 0), CN.num(searches) + ' searches') +\n        tile('users', 'Accounts', CN.num((us.users || []).length), online + ' online now') +\n        tile('bolt', 'Requests today', CN.num(o.requestsToday || 0), bytes(o.bytesToday) + ' today') +\n        tile('ban', 'Blocked hits', CN.num(blocked), 'filtered requests') +\n        tile('server', 'Memory limit', '\u003cspan class=\"grad-text\">Unlimited\u003c/span>', 'no WASM / time cap');\n      var ph = (o.perHour || []).map(function (x) { var d = new Date(x.hour); return { label: d.toLocaleTimeString([], { hour: 'numeric' }), title: d.toLocaleString([], { weekday: 'short', hour: 'numeric' }), value: x.requests }; });\n      CNCharts.bars($('#ovHours'), ph, { empty: 'No traffic in the last 48 hours.', fmt: function (v) { return CN.num(v) + ' requests'; }, ticks: 12, height: 190 });\n      var dl = (a.daily || []).slice(-30).map(function (x) { var d = new Date(x.day + 'T12:00:00'); var l = d.toLocaleDateString([], { month: 'short', day: 'numeric' }); return { label: l, value: x.count }; });\n      CNCharts.area($('#ovDaily'), dl, { empty: 'No activity yet.', fmt: function (v) { return v + ' events'; } });\n      CNCharts.hbars($('#ovDomains'), a.topDomains || [], { empty: 'No visits yet.' });\n      CNCharts.hbars($('#ovSearches'), a.topSearches || [], { empty: 'No searches yet.' });\n      CNCharts.hbars($('#ovBlocked'), a.blockedDomains || [], { empty: 'Nothing blocked.' });\n      CNCharts.donut($('#ovCats'), (a.categories || []).map(function (c) { return { label: c.key, value: c.count }; }), { center: 'blocked', empty: 'No blocked categories.' });\n      dataTable($('#ovAccounts'), {\n        rows: perUser, search: false, sortKey: 'last', sortDir: -1,\n        cols: [\n          { key: 'u', label: 'Account', sort: function (r) { return r.username.toLowerCase(); }, render: function (r) { return '\u003cspan class=\"who\">' + avatar(r.username) + esc(r.username) + '\u003c/span>'; } },\n          { key: 'n', label: 'Pages', num: true, sort: function (r) { return r.navigations; }, render: function (r) { return CN.num(r.navigations); } },\n          { key: 's', label: 'Searches', num: true, sort: function (r) { return r.searches; }, render: function (r) { return CN.num(r.searches); } },\n          { key: 'b', label: 'Blocked', num: true, sort: function (r) { return r.blocked; }, render: function (r) { return r.blocked ? '\u003cspan class=\"badge bad\">' + r.blocked + '\u003c/span>' : '0'; } },\n          { key: 'last', label: 'Last active', sort: function (r) { return r.lastActive; }, render: function (r) { return '\u003cspan title=\"' + esc(new Date(r.lastActive).toLocaleString()) + '\">' + CN.ago(r.lastActive) + '\u003c/span>'; } }\n        ], empty: ['users', 'No activity yet', 'Accounts show up once they browse.']\n      });\n      $('#sessTtl').textContent = ss.ttlMs ? 'idle timeout ' + Math.round(ss.ttlMs / 3600000) + 'h' : '';\n      dataTable($('#ovSessions'), {\n        rows: ss.sessions || [], search: false,\n        cols: [\n          { key: 'u', label: 'Account', render: function (r) { return '\u003cspan class=\"who\">' + avatar(r.username) + esc(r.username) + '\u003c/span>'; } },\n          { key: 'id', label: 'Session', render: function (r) { return '\u003cspan class=\"mono-sm\">' + esc(r.sessionId) + '\u003c/span>'; } },\n          { key: 'idle', label: 'Idle', sort: function (r) { return r.idleSec; }, render: function (r) { return CN.dur(r.idleSec); } },\n          { key: 'st', label: 'Status', render: function (r) { return r.current ? '\u003cspan class=\"badge ok\">\u003ci class=\"dot pulse\">\u003c/i>active\u003c/span>' : '\u003cspan class=\"badge\">superseded\u003c/span>'; } }\n        ], empty: ['key', 'No live sessions', 'Nobody is signed in right now.']\n      });\n    });\n  }\n  $('#ovRefresh').addEventListener('click', loadOverview);\n\n  /* ---------- activity ---------- */\n  function fillUserFilter() {\n    var sel = $('#fUser'), cur = sel.value;\n    sel.innerHTML = '\u003coption value=\"\">All accounts\u003c/option>' + S.users.map(function (u) { return '\u003coption value=\"' + esc(u.id) + '\">' + esc(u.username) + '\u003c/option>'; }).join('');\n    sel.value = cur;\n  }\n  function actParams() {\n    return { user: $('#fUser').value, type: $('#fType').value, q: $('#fQ').value.trim(), from: $('#fFrom').value, to: $('#fTo').value };\n  }\n  var TYPE_BADGE = { navigate: 'info', search: 'accent', blocked: 'bad', login: 'ok', logout: '' };\n  var actTable = null;\n  function loadActivity(page) {\n    var q = Object.assign(actParams(), { page: page, limit: 50 });\n    if (!actTable) $('#actTable').innerHTML = '\u003cdiv class=\"skel\" style=\"height:240px;border-radius:14px\">\u003c/div>';\n    CN.api('/api/admin/activity', { query: q }).then(function (r) {\n      if (!ok(r)) return;\n      var d = r.data; S.act = { page: d.page, pages: d.pages, total: d.total };\n      actTable = dataTable($('#actTable'), {\n        rows: d.events || [], search: false,\n        cols: [\n          { key: 'ts', label: 'When', render: function (e) { return '\u003cspan title=\"' + esc(new Date(e.ts).toLocaleString()) + '\">' + CN.dt(e.ts) + '\u003c/span>'; } },\n          { key: 'u', label: 'Account', render: function (e) { return esc(e.username || '?'); } },\n          { key: 't', label: 'Type', render: function (e) { return '\u003cspan class=\"badge type-pill ' + (TYPE_BADGE[e.type] || '') + '\">' + esc(e.type) + '\u003c/span>'; } },\n          { key: 'd', label: 'Details', wrap: true, render: function (e) {\n            var main = e.type === 'search' ? (e.query || e.url || '') : (e.url || e.hostname || '');\n            return '\u003cspan class=\"cell-url\" title=\"' + esc(main) + '\">' + esc(String(main).slice(0, 140)) + '\u003c/span>' + (e.title ? '\u003cdiv class=\"cell-sub\">' + esc(CN.decode(e.title).slice(0, 90)) + '\u003c/div>' : ''); } },\n          { key: 'c', label: 'Category', render: function (e) { return e.category ? '\u003cspan class=\"badge warn\">' + esc(e.category) + '\u003c/span>' : '\u003cspan class=\"faint\">—\u003c/span>'; } }\n        ], empty: ['activity', 'No matching events', 'Try widening the filters.']\n      });\n      $('#pInfo').textContent = 'Page ' + d.page + ' of ' + d.pages + ' · ' + CN.num(d.total) + ' events';\n      $('#pPrev').disabled = d.page \u003c= 1; $('#pNext').disabled = d.page >= d.pages;\n    });\n  }\n  $('#fApply').addEventListener('click', function () { loadActivity(1); });\n  $('#fReset').addEventListener('click', function () { ['#fUser', '#fType', '#fQ', '#fFrom', '#fTo'].forEach(function (s) { $(s).value = ''; }); loadActivity(1); });\n  $('#fQ').addEventListener('keydown', function (e) { if (e.key === 'Enter') loadActivity(1); });\n  $('#pPrev').addEventListener('click', function () { loadActivity(S.act.page - 1); });\n  $('#pNext').addEventListener('click', function () { loadActivity(S.act.page + 1); });\n  $('#actExport').addEventListener('click', function () {\n    var btn = this; btn.classList.add('loading');\n    var p = actParams(), qs = Object.keys(p).filter(function (k) { return p[k]; }).map(function (k) { return k + '=' + encodeURIComponent(p[k]); }).join('&');\n    // fetch with the token header (a plain navigation may not carry the cookie), then save the blob\n    fetch(CN.url('/api/admin/activity/export.csv' + (qs ? '?' + qs : '')), { credentials: 'include', headers: CN.headers() }).then(function (res) {\n      if (!res.ok) throw new Error('Export failed (' + res.status + ')');\n      return res.blob();\n    }).then(function (blob) {\n      var a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = 'activity-export.csv';\n      document.body.appendChild(a); a.click(); setTimeout(function () { URL.revokeObjectURL(a.href); a.remove(); }, 500);\n      CN.toast('CSV downloaded', 'ok');\n    }).catch(function (e) { CN.toast(e.message || 'Export failed', 'bad'); }).then(function () { btn.classList.remove('loading'); });\n  });\n\n  /* ---------- users ---------- */\n  var usersTable = null;\n  function loadUsers() {\n    return CN.api('/api/admin/users').then(function (r) {\n      if (!ok(r)) return;\n      S.users = r.data.users || [];\n      if (!$('#sec-users').hidden) renderUsers();\n      return S.users;\n    });\n  }\n  function renderUsers() {\n    usersTable = dataTable($('#usersTable'), {\n      rows: S.users, searchPlaceholder: 'Search users', sortKey: 'u',\n      text: function (u) { return u.username + ' ' + u.role + (u.disabled ? ' suspended' : '') + (u.online ? ' online' : ''); },\n      cols: [\n        { key: 'u', label: 'User', sort: function (u) { return u.username.toLowerCase(); }, render: function (u) {\n          return '\u003cspan class=\"who\">' + avatar(u.username) + '\u003cspan>' + esc(u.username) + (u.protected ? ' \u003cspan class=\"badge info\" title=\"Protected owner account\">protected\u003c/span>' : '') + '\u003c/span>\u003c/span>'; } },\n        { key: 'r', label: 'Role', sort: function (u) { return u.role; }, render: function (u) { return '\u003cspan class=\"badge ' + (u.role === 'admin' ? 'accent' : '') + '\">' + esc(u.role) + '\u003c/span>'; } },\n        { key: 's', label: 'Status', sort: function (u) { return u.disabled ? 0 : u.online ? 2 : 1; }, render: function (u) {\n          return u.disabled ? '\u003cspan class=\"badge bad\">suspended\u003c/span>' : u.online ? '\u003cspan class=\"badge ok\">\u003ci class=\"dot pulse\">\u003c/i>online\u003c/span>' : '\u003cspan class=\"badge\">offline\u003c/span>'; } },\n        { key: 'm', label: 'Memory', render: function () { return '\u003c     this.loading = false;
    this.homeCard.hidden = true;
    this.errCard.hidden = false;
    this.errCard.querySelector('.err-title').textContent = title;
    this.errCard.querySelector('.err-body').textContent = body || '';
    var d = this.errCard.querySelector('.detail');
    if (detail) { d.textContent = detail; d.hidden = false; }
    else { d.hidden = true; }
    this.render();
    syncChrome();
  };

  Tab.prototype.go = function (input, mode, post) {
    var self = this;
    var abs = normalizeUrl(input);
    if (!abs) {
      this.showError('Not a valid address', 'That address uses a scheme this shell never loads.', String(input));
      return;
    }
    mode = mode || 'push';
    if (mode === 'push') {
      this.history = this.history.slice(0, this.index + 1);
      this.history.push(abs);
      this.index = this.history.length - 1;
    } else if (mode === 'replace' && this.index >= 0) {
      this.history[this.index] = abs;
    } else if (mode === 'replace') {
      this.history = [abs];
      this.index = 0;
    }
    this.url = abs;
    this.applySandbox(abs);
    this.error = null;
    this.loading = true;
    this.homeCard.hidden = true;
    this.errCard.hidden = true;
    this.render();
    syncChrome();

    if (this.abort) { try { this.abort.abort(); } catch (e) {} }
    var ctl = (typeof AbortController !== 'undefined') ? new AbortController() : null;
    this.abort = ctl;
    var myToken = ++this.token;
    tokenSeq += 1;

    var headers = { accept: 'application/json' };
    var tok = mnuToken();
    if (tok) headers['X-Mnu-Token'] = tok;
    function docUrl(s) {
      return DOC_PATH + '?u=' + b64url(abs) + (s ? '&sid=' + encodeURIComponent(s) : '');
    }
    function load(s, retried) {
      var opts = {
        cache: 'no-store',
        credentials: 'include',
        headers: headers,
        signal: ctl ? ctl.signal : undefined
      };
      if (post) { // form POST navigation: same /x/doc contract, body carried as JSON
        opts.method = 'POST';
        opts.headers = Object.assign({ 'content-type': 'application/json' }, headers);
        opts.body = JSON.stringify({ u: b64url(abs), sid: s, method: post.method, body: post.body, contentType: post.contentType });
      }
      return fetch(post ? DOC_PATH : docUrl(s), opts).then(function (res) {
        return res.text().then(function (text) {
          var data = null;
          try { data = JSON.parse(text); } catch (e) { /* fall through */ }
          if (!data) throw { status: res.status, message: 'Server returned a non-JSON response (' + res.status + ').' };
          return { status: res.status, data: data };
        });
      }).then(function (out) {
        if (self.token !== myToken) return; // superseded
        var data = out.data;
        if (out.status === 401) { self.loading = false; self.render(); syncChrome(); showGate(null); return; }
        if (data && data.ok === false && data.error === 'bad_sid' && !retried) {
          try { localStorage.removeItem(SID_KEY); } catch (e) {}
          return mintSid().then(function (fresh) { return load(fresh, true); });
        }
        if (!out || !data || data.ok === false || typeof data.html !== 'string') {
          var msg = (data && (data.message || data.error)) || 'That site could not be loaded.';
          self.showError('This page did not load', msg, abs);
          return;
        }
      if (data.sid) { try { localStorage.setItem(SID_KEY, data.sid); } catch (e) {} }
      var finalUrl = data.finalUrl || abs;
      // Redirects may change which origin's storage and sandbox policy apply.
      self.applySandbox(finalUrl);
      self.url = finalUrl;
      if (self.index >= 0) self.history[self.index] = finalUrl;
      if (data.title) self.title = CN.decode(data.title);
      rememberRecent(finalUrl, self.title);
      // RENDER: srcdoc only — the target URL never touches iframe.src.
      try {
        self.frame.setAttribute('srcdoc', data.html);
      } catch (e) {
        // Very large documents can exceed srcdoc limits: same bytes via blob:.
        try {
          if (self.blobUrl) { try { URL.revokeObjectURL(self.blobUrl); } catch (e2) {} }
          self.blobUrl = URL.createObjectURL(new Blob([data.html], { type: 'text/html' }));
          self.frame.src = self.blobUrl;
        } catch (e3) {
          self.showError('This page did not load', 'Could not build the page document.', String(e3 && e3.message || e3));
          return;
        }
      }
        self.loading = false;
        self.render();
        syncChrome();
      }).catch(function (err) {
        if (self.token !== myToken) return;
        if (err && err.name === 'AbortError') return;
        self.showError(
          'This page did not load',
          (err && err.name === 'TypeError')
            ? 'Could not reach the cloak server (' + DOC_PATH + ').'
            : ((err && err.message) || 'Request failed.'),
          abs
        );
      });
    }
    ensureSid().then(function (s) { return load(s, false); }).catch(function (err) {
      if (self.token !== myToken) return;
      if (err && err.name === 'AbortError') return;
      self.showError('This page did not load', (err && err.message) || 'Could not start a session.', abs);
    });
  };

  Tab.prototype.render = function () {
    var label = (this.title && this.title !== 'New tab') ? this.title
      : (this.url ? hostOf(this.url) : 'New tab');
    this.labelEl.textContent = label;
    this.btn.title = this.url || 'New tab';
    this.btn.className = 'tab' +
      (active === this ? ' is-active' : '') +
      (this.loading ? ' is-loading' : '') +
      (this.error ? ' is-error' : '');
    this.pane.classList.toggle('is-active', active === this);
  };

  Tab.prototype.destroy = function () {
    this.token += 1;
    if (this.abort) { try { this.abort.abort(); } catch (e) {} }
    if (this.blobUrl) { try { URL.revokeObjectURL(this.blobUrl); } catch (e) {} }
    try { this.frame.src = 'about:blank'; } catch (e) {}
    if (this.pane.parentNode) this.pane.parentNode.removeChild(this.pane);
    if (this.btn.parentNode) this.btn.parentNode.removeChild(this.btn);
  };

  function newTab(url) {
    var t = new Tab();
    tabs.push(t);
    focusTab(t);
    if (url) t.go(url);
    else if (newtabPref() === 'start') t.showHome();
    else t.go(HOME_URL);
    return t;
  }
  function focusTab(t) {
    active = t;
    tabs.forEach(function (x) { x.render(); });
    syncChrome();
    try { if (devHooks) devHooks.focus(t); } catch (e) {}
  }
  function closeTab(t) {
    var i = tabs.indexOf(t);
    if (i === -1) return;
    try { if (devHooks) devHooks.closed(t); } catch (e) {}
    t.destroy();
    tabs.splice(i, 1);
    if (!tabs.length) { newTab(); return; }
    if (active === t) focusTab(tabs[Math.min(i, tabs.length - 1)]);
    else syncChrome();
  }

  function syncChrome() {
    var t = active;
    $('back').disabled = !(t && t.index > 0);
    $('forward').disabled = !(t && t.index >= 0 && t.index < t.history.length - 1);
    $('reload').disabled = !(t && t.url);
    toolbar.classList.toggle('is-loading', !!(t && t.loading));
    omniBox.classList.toggle('is-loading', !!(t && t.loading));
    omniBox.classList.toggle('is-error', !!(t && t.error));
    if (document.activeElement !== omni) omni.value = (t && t.url) || '';
  }

  /* runtime bridge: proxied docs ask the shell to navigate (same as veil). */
  var NATIVE_POST = window.postMessage;
  /* Keyboard Lock bridge. navigator.keyboard.lock() throws unless called from the
   * primary top-level browsing context - the shell, not the proxied frame. The
   * frame's shim (cloak-compat.js) asks; only the ACTIVE tab's window may, keys must
   * be plain strings, and the outcome (real success or the browser's real error) is
   * sent back - nothing is faked. */
  window.addEventListener('message', function (ev) {
    var d = ev && ev.data;
    if (!d || typeof d !== 'object' || (d.cloakKbd !== 'lock' && d.cloakKbd !== 'unlock')) return;
    if (!active || !active.frame || ev.source !== active.frame.contentWindow) return;
    var reply = function (ok, err) {
      // The shell's own native postMessage, NOT ev.source.postMessage: the frame's
      // window has cloak-compat's wrapper installed, which envelopes payloads.
      try { NATIVE_POST.call(ev.source, { cloakKbdResult: d.id, ok: ok, err: err || null }, '*'); } catch (e) {}
    };
    var kb = navigator.keyboard;
    if (!kb) return reply(false, 'NotSupportedError: Keyboard Lock API unavailable');
    if (d.cloakKbd === 'unlock') { try { kb.unlock(); } catch (e) {} return reply(true); }
    var keys = Array.isArray(d.keys) ? d.keys.filter(function (k) { return typeof k === 'string' && k.length < 32; }).slice(0, 128) : [];
    kb.lock(keys).then(function () { reply(true); }, function (e) { reply(false, String((e && e.name) || 'Error') + ': ' + String((e && e.message) || e)); });
  });

  window.addEventListener('message', function (ev) {
    var d = ev && ev.data;
    if (!d || typeof d !== 'object' || d.veil !== true) return;
    if (!active || !active.frame || ev.source !== active.frame.contentWindow) return;
    if (d.type === 'navigate' && d.url) active.go(d.url, d.replace ? 'replace' : 'push',
      d.method && String(d.method).toUpperCase() !== 'GET' ? { method: String(d.method), body: typeof d.body === 'string' ? d.body : '', contentType: typeof d.contentType === 'string' ? d.contentType : '' } : undefined);
    else if (d.type === 'url' && d.url) {
      active.url = d.url;
      if (active.index >= 0) active.history[active.index] = d.url;
      active.render(); syncChrome();
    } else if (d.type === 'title' && d.title) {
      active.title = String(d.title);
      active.render();
    }
  });

  /* ---------------- sheets: History / Stats / Admin ------------------------ */
  /* First-party pages served by the cloak-next server (real origin, real
   * localStorage), shown in an overlay iframe. They are NOT proxied content.
   * The session token is handed over as ?mnuToken= (cn.js adopts + scrubs it)
   * because this shell may itself live on a blob:/about:blank origin. */
  var SHEETS = {
    history: { title: 'History', page: 'history.html', wide: false },
    stats: { title: 'Stats', page: 'stats.html', wide: true },
    admin: { title: 'Admin panel', page: 'admin.html', wide: true }
  };
  var sheetEl = $('sheet'), sheetFrame = $('sheetFrame'), sheetOpen = null;
  function openSheet(name) {
    var def = SHEETS[name];
    if (!def) return;
    closeMenu();
    sheetOpen = name;
    $('sheetTitle').textContent = def.title;
    sheetEl.classList.toggle('wide', !!def.wide);
    $('sheetOpen').href = CN.page(def.page, {}, true);
    // Page document is built from launch.html's own embedded sources and given to the frame as srcdoc.
    if (!CNPages.load(sheetFrame, name, { embed: true })) sheetFrame.src = CN.page(def.page, { embed: 1 }, true);
    sheetEl.hidden = false;
  }
  function closeSheet() {
    if (sheetEl.hidden) return;
    sheetEl.hidden = true;
    sheetOpen = null;
    try { CNPages.blank(sheetFrame); } catch (e) {}
  }
  $('sheetClose').addEventListener('click', closeSheet);
  sheetEl.addEventListener('mousedown', function (e) { if (e.target === sheetEl) closeSheet(); });

  /* Messages from the first-party sheet / gate frames (source-checked). */
  window.addEventListener('message', function (ev) {
    var d = ev && ev.data;
    if (!d || typeof d !== 'object') return;
    var fromSheet = ev.source === sheetFrame.contentWindow;
    var fromGate = ev.source === $('gateFrame').contentWindow;
    if (fromSheet && d.cloakShell === 'open' && typeof d.url === 'string') {
      var abs = normalizeUrl(d.url);
      if (abs && active) { closeSheet(); if (d.newTab) newTab(abs); else active.go(abs); }
    } else if ((fromSheet || fromGate) && d.cloakShell === 'page' && typeof d.page === 'string') {
      // inter-page navigation requested by a srcdoc page (links between pages)
      var pg = d.page;
      if (fromGate && (pg === 'login' || pg === 'request-access')) loadGate(pg, d.params);
      else if (fromSheet && SHEETS[pg]) openSheet(pg);
      else if (fromSheet && pg === 'launch') closeSheet();
      else if (fromSheet && pg === 'login') showGate(null);
    } else if (fromSheet && d.cloakShell === 'close') {
      closeSheet();
    } else if ((fromSheet || fromGate) && d.cloakAuth === 'expired') {
      showGate(d.reason === 'elsewhere' ? 'superseded' : null);
    } else if (fromGate && d.cloakAuth === 'login') {
      if (d.token) CN.Token.set(d.token);
      try { localStorage.removeItem(SID_KEY); } catch (e) {}
      $('gate').hidden = true;
      CNPages.blank($('gateFrame'));
      boot();
    }
  });

  /* ---------------- omnibox suggestions ------------------------------------ */
  var suggestEl = $('suggest'), sugItems = [], sugIndex = -1, sugTimer = null, sugSeq = 0;
  function closeSuggest() { suggestEl.hidden = true; sugItems = []; sugIndex = -1; }
  function paintSuggest() {
    suggestEl.innerHTML = '';
    if (!sugItems.length) { suggestEl.hidden = true; return; }
    sugItems.forEach(function (it, i) {
      if (it.head) {
        var h = document.createElement('div'); h.className = 'sh'; h.textContent = it.head; suggestEl.appendChild(h); return;
      }
      var row = document.createElement('div');
      row.className = 'sg' + (i === sugIndex ? ' on' : '');
      row.innerHTML = '<span class="si">' + CN.icon(it.icon, 16) + '</span><span class="st">' + esc(it.text) + '</span>' + (it.sub ? '<span class="ss">' + esc(it.sub) + '</span>' : '');
      row.addEventListener('mousedown', function (e) { e.preventDefault(); chooseSuggest(it); });
      suggestEl.appendChild(row);
    });
    suggestEl.hidden = false;
  }
  function chooseSuggest(it) {
    closeSuggest();
    omni.blur();
    if (active) active.go(it.go);
  }
  function updateSuggest() {
    var v = omni.value.trim();
    if (!v) { closeSuggest(); return; }
    var abs = normalizeUrl(v);
    var isUrl = abs && abs.indexOf(SEARCH_URL) !== 0;
    var base = [{ head: null, icon: isUrl ? 'globe' : 'search', text: isUrl ? abs : v, sub: isUrl ? 'Go to site' : 'Search Google', go: v }];
    sugItems = base; sugIndex = 0; paintSuggest();
    clearTimeout(sugTimer);
    var my = ++sugSeq;
    sugTimer = setTimeout(function () {
      CN.api('/api/history', { query: { q: v, limit: 20 }, noAuthRedirect: true }).then(function (r) {
        if (my !== sugSeq || document.activeElement !== omni) return;
        var items = (r.ok && r.data && r.data.items) || [];
        var seen = {}, extra = [];
        items.forEach(function (it) {
          if (seen[it.url] || extra.length >= 5) return; seen[it.url] = 1;
          extra.push({ icon: 'history', text: it.title || hostOf(it.url), sub: hostOf(it.url), go: it.url });
        });
        if (extra.length) { sugItems = base.concat([{ head: 'From your history' }], extra); paintSuggest(); }
      });
    }, 160);
  }
  omni.addEventListener('input', updateSuggest);
  omni.addEventListener('focus', function () { omni.select(); });
  omni.addEventListener('blur', function () { setTimeout(closeSuggest, 120); });

  /* ---------------- account menu ------------------------------------------- */
  var menu = $('menu'), menuBtn = $('menuBtn');
  function closeMenu() { menu.hidden = true; menuBtn.setAttribute('aria-expanded', 'false'); }
  menuBtn.addEventListener('click', function (e) {
    e.stopPropagation();
    var open = menu.hidden;
    menu.hidden = !open;
    menuBtn.setAttribute('aria-expanded', String(open));
  });
  document.addEventListener('mousedown', function (e) { if (!menu.hidden && !e.target.closest('.menuwrap')) closeMenu(); });
  function paintNewtabItem() { $('miNewtabVal').textContent = newtabPref() === 'start' ? 'Start page' : 'Google'; }
  $('miNewtab').addEventListener('click', function () {
    try { localStorage.setItem(NEWTAB_KEY, newtabPref() === 'start' ? 'google' : 'start'); } catch (e) {}
    paintNewtabItem();
  });
  $('miTheme').addEventListener('click', function () { CN.theme.toggle(); closeMenu(); });
  $('miPrank').addEventListener('click', function () { closeMenu(); if (window.CNPranks) CNPranks.openPanel(); });
  $('miLogout').addEventListener('click', function () {
    closeMenu();
    CN.logout().then(function () {
      try { localStorage.removeItem(SID_KEY); } catch (e) {}
      me = null;
      showGate(null);
    });
  });
  $('cloakBtn').addEventListener('click', function () { closeMenu(); window.openCloak && window.openCloak(); });
  paintNewtabItem();

  /* ---------------- wiring ------------------------------------------------- */
  $('back').addEventListener('click', function () {
    if (active && active.index > 0) {
      active.index -= 1;
      active.go(active.history[active.index], 'jump');
    }
  });
  $('forward').addEventListener('click', function () {
    if (active && active.index < active.history.length - 1) {
      active.index += 1;
      active.go(active.history[active.index], 'jump');
    }
  });
  $('reload').addEventListener('click', function () {
    if (active && active.url) active.go(active.url, 'jump');
  });
  $('home').addEventListener('click', function () { if (active) { if (newtabPref() === 'start') active.showHome(); else active.go(HOME_URL); } });
  $('startBtn').addEventListener('click', function () { if (active) active.showHome(); });
  $('histBtn').addEventListener('click', function () { openSheet('history'); });
  $('statsBtn').addEventListener('click', function () { openSheet('stats'); });
  $('adminBtn').addEventListener('click', function () { openSheet('admin'); });
  $('newTab').addEventListener('click', function () { newTab(); });
  $('panicBtn').addEventListener('click', panicNow);
  omniForm.addEventListener('submit', function (e) {
    e.preventDefault();
    var pick = sugIndex > 0 && sugItems[sugIndex] && !sugItems[sugIndex].head ? sugItems[sugIndex].go : omni.value.trim();
    closeSuggest();
    if (pick && active) { active.go(pick); omni.blur(); }
  });
  omni.addEventListener('keydown', function (e) {
    if (e.key === 'Escape') { closeSuggest(); omni.value = (active && active.url) || ''; omni.blur(); return; }
    if ((e.key === 'ArrowDown' || e.key === 'ArrowUp') && sugItems.length) {
      e.preventDefault();
      var dir = e.key === 'ArrowDown' ? 1 : -1, n = sugItems.length, i = sugIndex;
      do { i = (i + dir + n) % n; } while (sugItems[i].head);
      sugIndex = i;
      omni.value = sugItems[i].go; paintSuggest();
    }
  });
  document.addEventListener('keydown', function (e) {
    var mod = e.ctrlKey || e.metaKey;
    if (mod && e.key === 't') { e.preventDefault(); newTab(); }
    else if (mod && e.key === 'l') { e.preventDefault(); omni.focus(); omni.select(); }
    else if (mod && e.key === 'h') { e.preventDefault(); sheetOpen === 'history' ? closeSheet() : openSheet('history'); }
    else if (e.key === 'Escape' && !sheetEl.hidden) closeSheet();
    else if (e.altKey && e.key === 'ArrowLeft') { e.preventDefault(); $('back').click(); }
    else if (e.altKey && e.key === 'ArrowRight') { e.preventDefault(); $('forward').click(); }
  });

  /* about:blank launcher: open blank window, write this shell inline (no URL iframe).
   * Inlines every asset the shell needs (ui.css, shell.css, pranks.css, cn.js,
   * pranks.js, shell.js) — anything not inlined would be silently missing there. */
  window.openCloak = function openCloak() {
    var win = window.open('about:blank', '_blank');
    if (!win) { toast('Allow popups to open the cloak.'); return null; }
    // launch.html is one self-contained document (scripts/build-launch.js): write it as-is.
    fetch(BASE + '/x/static/launch.html', { credentials: 'include', cache: 'no-cache', headers: CN.headers ? CN.headers() : {} })
      .then(function (r) { return r.text(); })
      .then(function (doc) {
        if (!/<body/i.test(doc)) throw new Error('bad launch.html');
        doc = doc.replace(/<title>[\s\S]*?<\/title>/i, '<title>' + esc(cloak.title) + '</title>');
        if (!/window\.CLOAK_BASE/.test(doc)) doc = doc.replace(/<head>/i, '<head><script>window.CLOAK_BASE=' + JSON.stringify(BASE) + ';<\/script>');
        win.document.open();
        win.document.write(doc);
        win.document.close();
      }).catch(function () { toast('Could not build the cloak document.'); });
    return win;
  };

  /* DevTools panel (devtools.js): one-shot handoff, then the global is gone. Never allowed to break boot. */
  try {
    if (typeof window.__cloakDevInit === 'function') {
      devHooks = window.__cloakDevInit({
        tabs: function () { return tabs; },
        active: function () { return active; },
        toast: toast,
        reload: function () { if (active && active.url) active.go(active.url, 'jump'); },
        resetSession: function () { try { localStorage.removeItem(SID_KEY); } catch (e) {} },
        signOut: function () { var b = $('miLogout'); if (b) b.click(); }
      });
    }
  } catch (e) { devHooks = null; }

  /* ---------------- boot / gate ------------------------------------------- */
  var booted = false;
  function loadGate(page, query) {
    if (!CNPages.load($('gateFrame'), page, { embed: true, query: query || {} })) $('gateFrame').src = CN.page(page + '.html', Object.assign({ embed: 1 }, query || {}));
  }
  function showGate(reason) {
    closeSheet();
    if (window.CNPranks) CNPranks.pause(true);
    var msg = reason === 'superseded'
      ? 'You signed in somewhere else, so this session was closed.'
      : 'Sign in to use the shell.';
    $('gateReason').textContent = msg;
    loadGate('login', { reason: reason === 'superseded' ? 'elsewhere' : '' });
    $('gate').hidden = false;
  }
  function applyUser(user) {
    me = user || null;
    var name = (me && me.username) || 'guest';
    $('avatarLetter').textContent = name.charAt(0);
    $('menuUser').textContent = name;
    $('menuRole').textContent = (me && me.role) || '';
    $('adminBtn').hidden = !(me && me.role === 'admin');
    tickClock();
    if (window.CNPranks) CNPranks.pause(false);
    if (window.CNPranks) CNPranks.init({ user: me, onAllowed: function (ok) { $('miPrank').hidden = !ok; } });
  }
  function boot() {
    checkAuth().then(function (st) {
      if (st.open) {
        if (st.offline) toast('Offline — showing the shell anyway.');
        applyUser(st.user);
        if (!booted) {
          booted = true;
          var go = null;
          try { go = new URLSearchParams(location.search).get('go'); } catch (e) {}
          newTab(go && /^https?:\/\//i.test(go) ? go : undefined);
        }
        else if (active && !active.url) { if (newtabPref() === 'start') active.showHome(); else active.go(HOME_URL); }
        return;
      }
      showGate(st.reason === 'superseded' ? 'superseded' : null);
    });
  }

  CN.hydrate(document);
  applyCloak();
  boot();
})();

</script>
</body>
</html>
